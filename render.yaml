# Blueprint de Render: https://render.com/docs/blueprint-spec
# Al conectar el repo a GitHub, Render usa este archivo para crear el servicio.
services:
  - type: web
    name: devstore
    runtime: node
    plan: free
    nodeVersion: "22.x"
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /
    envVars:
      # Secreto de sesión: Render lo genera y guarda en Variables de Entorno.
      - key: SECRET
        generateValue: true
      # Ruta de la base de datos SQLite dentro del contenedor.
      # Plan free: disco efímero; devstore.db (versionado) se restaura en cada
      # deploy/reinicio y los cambios en runtime se pierden.
      # Para persistir, usa un plan de pago con disco montado en /var/data:
      #   disk:
      #     name: devstore-data
      #     mountPath: /var/data
      #     sizeGB: 1
      # y cambia DB_PATH a /var/data/devstore.db
      - key: DB_PATH
        value: devstore.db
